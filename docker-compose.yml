services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  muraena:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      # config.toml, TLS certs, watchdog.rules, geoDB.mmdb, instrument.necro
      - ./config:/app/config:ro
    cap_add:
      - NET_BIND_SERVICE
    # NOTE: set [redis] host = "redis" in config.toml when using Docker Compose

  # ── Necrobrowser-NG ──────────────────────────────────────────────────────
  # Included automatically when setup.sh clones + configures it.
  # Start manually with:  docker compose --profile necrobrowser up -d
  # Or just run:          ./setup.sh  (it handles everything)
  necrobrowser:
    profiles: [necrobrowser]
    build:
      context: ./necrobrowser-ng
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  redis-data:
