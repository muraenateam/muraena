{{define "title"}}Login{{end}}
{{define "content"}}
<div class="bg-white shadow-md rounded-lg p-8 mt-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Login</h2>
    {{if .Error}}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{{.Error}}</div>
    {{end}}
    <form method="POST" action="/login">
        <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="email" name="email" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                placeholder="you@example.com">
        </div>
        <div class="mb-4">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                placeholder="Enter your password">
        </div>
        <input type="hidden" name="submit_login" value="1">
        <button type="submit"
            class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 font-medium">
            Sign In
        </button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600">
        Don't have an account? <a href="/signup" class="text-indigo-600 hover:underline">Sign up</a>
    </p>
</div>
{{end}}
